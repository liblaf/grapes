#:schema https://json.schemastore.org/pyproject.json
# ref: <https://packaging.python.org/en/latest/specifications/pyproject-toml/>

[project]
name = "liblaf-grapes"
description = "🍇 Supercharge your Python with rich logging, precise timing, and seamless serialization."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "liblaf", email = "30631553+liblaf@users.noreply.github.com" }
]
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: File Formats",
  "Topic :: File Formats :: JSON",
  "Topic :: Software Development",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System",
  "Topic :: System :: Logging",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Filters",
  "Topic :: Utilities",
  "Typing :: Typed"
]
dependencies = [
  "about-time>=4",
  "asttokens>=3",
  "attrs>=25",
  "autoregistry>=1.1",
  "cachebox>=5.1",
  "cytoolz>=1",
  "environs>=14",
  "executing>=2.1",
  "fieldz>=0.1",
  "joblib>=1.4",
  "lazy-loader>=0.5",
  "limits>=5",
  "msgspec[toml,yaml]>=0.20",
  "packaging>=26",
  "pendulum>=3",
  "platformdirs>=4",
  "pydantic>=2.12",
  "quantiphy>=2.20",
  "rich>=14.3",
  "toolz>=1",
  "wadler-lindig>=0.1.5",
  "wrapt>=2"
]
dynamic = ["version"]

[project.urls]
"Changelog" = "https://github.com/liblaf/grapes/blob/main/CHANGELOG.md"
"Documentation" = "https://liblaf-grapes.readthedocs.io/"
"Homepage" = "https://github.com/liblaf/grapes"
"Issue Tracker" = "https://github.com/liblaf/grapes/issues"
"Release Notes" = "https://github.com/liblaf/grapes/releases"
"Source Code" = "https://github.com/liblaf/grapes"

[project.optional-dependencies]
bench = ["matplotlib>=3"]

[dependency-groups]
dev = ["ipykernel>=7", "matplotlib>=3", "numpy>=2"]
build = ["check-wheel-contents>=0.6", "hatch>=1", "twine>=6"]
docs = [
  "griffe-fieldz>=0.5",
  "griffe-inherited-docstrings>=1",
  "griffe-pydantic>=1",
  "griffe-warnings-deprecated>=1",
  "mkdocstrings[python]>=1",
  "zensical>=0.0.30"
]
lint = ["import-linter[ui]>=2", "ruff>=0.15"]
nox = ["liblaf-nox-recipes>=0.1", "nox>=2026"]
test = [
  "pytest>=9",
  "pytest-cov>=7",
  "pytest-randomly>=4",
  "pytest-xdist>=3",
  { include-group = "dev" }
]
typing = ["toolz-stubs>=0.4"]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.check-wheel-contents]
ignore = ["W002"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.hatch.build.hooks.vcs]
version-file = "src/liblaf/grapes/_version.py"

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/liblaf"]

[tool.hatch.version]
source = "vcs"

[tool.importlinter]
root_package = "liblaf.grapes"

[[tool.importlinter.contracts]]
ancestors = ["liblaf.grapes"]
name = "Acyclic siblings"
type = "acyclic_siblings"

[tool.pytest]
addopts = [
  "--doctest-modules",
  "--import-mode=importlib",
  "--junitxml=junit.xml",
  "--numprocesses=auto",
  "--showlocals"
]
consider_namespace_packages = true
junit_family = "legacy"
strict = true
testpaths = ["benches", "src", "tests"]

[tool.ruff]
extend = ".config/linters/.ruff.toml"

[tool.ruff.lint.per-file-ignores]
"prompts/*.py" = ["ALL"]

[tool.uv]
default-groups = "all"
